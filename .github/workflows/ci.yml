name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Bumped to match the repo manifests: pyproject.toml declares
  # ``requires-poetry = ">=2.0"`` (Poetry 1.8.4 rejected it with "The fields
  # ... are required in package mode" + "requires-poetry was unexpected") and
  # frontend/package.json pins ``packageManager: pnpm@10.24.0`` / ``engines.pnpm
  # >=10`` (pnpm 9 failed with ERR_PNPM_UNSUPPORTED_ENGINE). 2.2.1 / 10.24.0 are
  # the versions verified working locally.
  POETRY_VERSION: "2.2.1"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  PNPM_VERSION: "10.24.0"
  TERRAFORM_VERSION: "1.9.8"

jobs:
  # ---------------------------------------------------------------------------
  # Python lint (backend + ml + dagster). Por decision de Arthur (jun-2026) la
  # CI NO corre pytest (la suite con testcontainers/integration es muy larga);
  # los tests se corren en local. Aqui se valida calidad de codigo, no ejecucion.
  #
  # ``ruff check`` se acota a los paquetes de CODIGO FUENTE de la app
  # (backend ml dagster_project), NO a ``.`` -- esto excluye las celdas de los
  # notebooks commiteados con outputs (entregable visual del curso) y los scripts
  # operativos, que de otra forma metian deuda preexistente y rompian el job
  # aunque el codigo de la app estuviera limpio. ``ruff format --check`` y
  # ``mypy`` se reportan pero NO bloquean (deuda de formato repo-wide en ml/).
  # ---------------------------------------------------------------------------
  python:
    name: python-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Cache Poetry venv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock', 'pyproject.toml') }}

      - name: Install deps (dev only — sin grupo test, no se ejecutan pruebas)
        run: |
          poetry config virtualenvs.in-project true
          poetry install --with dev --no-root --no-interaction

      - name: Lint (ruff) — backend + ml + dagster (bloqueante)
        run: poetry run ruff check backend ml dagster_project

      - name: Lint format (ruff format --check) — no bloqueante
        run: poetry run ruff format --check backend ml dagster_project || echo "format no bloqueante (deuda repo-wide ml/)"

      - name: Type check (mypy) — no bloqueante
        run: poetry run mypy -p backend.app || echo "mypy no bloqueante"

  # ---------------------------------------------------------------------------
  # Python unit tests (rapidos, sin Docker ni datos). La suite completa (ML con
  # datos DVC, testcontainers, integracion) sigue corriendo en local; este job
  # cubre lo que rompe con mas frecuencia: backend/unit, scripts y los modulos
  # ML puros. `test_persist_features` usa testcontainers y se excluye aqui.
  # ---------------------------------------------------------------------------
  python-unit-tests:
    name: python-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Los tests de custodia comprueban que cada SHA del ledger pertenece a
          # la historia de HEAD. Un checkout superficial convierte procedencia
          # valida en "commit inexistente" y oculta el mecanismo que se prueba.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Cache Poetry venv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-tests-${{ runner.os }}-${{ hashFiles('poetry.lock', 'pyproject.toml') }}

      - name: Install deps (dev, test, ml, geo) + paquete raiz
        run: |
          poetry config virtualenvs.in-project true
          poetry install --with dev,test,ml,geo --no-interaction
          poetry install --only-root --no-interaction

      # Dos invocaciones: backend/tests y tests/ tienen cada uno su conftest y
      # pytest no puede cargarlos juntos como `tests.conftest`.
      - name: "mypy ml + dagster_project (bloqueante, 0 errores desde sep-2026)"
        run: poetry run mypy ml dagster_project

      - name: pytest backend (unit)
        working-directory: backend
        run: poetry run pytest tests/unit -q -p no:cacheprovider

      - name: pytest scripts + ML puro
        run: |
          poetry run pytest tests/scripts tests/ml/features tests/ml/utils tests/ml/report \
            tests/ml/agent tests/ml/models tests/ml/losses \
            -q -m "not slow and not integration and not requires_gee" \
            --ignore=tests/ml/features/test_persist_features.py -p no:cacheprovider

  # ---------------------------------------------------------------------------
  # Frontend lint
  # ---------------------------------------------------------------------------
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

  # ---------------------------------------------------------------------------
  # Database migrations (dbmate) on Postgres + PostGIS service
  # ---------------------------------------------------------------------------
  db:
    name: db-migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: agrosat
          POSTGRES_PASSWORD: agrosat
          POSTGRES_DB: agrosat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agrosat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install dbmate
        run: |
          curl -fsSL -o /tmp/dbmate https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          chmod +x /tmp/dbmate
          sudo mv /tmp/dbmate /usr/local/bin/dbmate

      # The official postgis/postgis image ships PostGIS but NOT pgvector, while
      # the initial migration does ``CREATE EXTENSION vector`` (pgvector). Install
      # the extension into the running service container from the PostgreSQL APT
      # repo (already configured in the postgres-based image) so the migration
      # succeeds without swapping to an experimental bundled image. The container
      # is resolved by its image since GitHub assigns it a generated name.
      - name: Install pgvector into the Postgres service
        run: |
          cid=$(docker ps --filter "ancestor=postgis/postgis:15-3.4" --format '{{.ID}}')
          if [ -z "$cid" ]; then echo "postgres service container not found"; exit 1; fi
          docker exec "$cid" bash -c "apt-get update && apt-get install -y postgresql-15-pgvector"

      - name: Run migrations
        env:
          DATABASE_URL: postgres://agrosat:agrosat@localhost:5432/agrosat?sslmode=disable
        run: |
          dbmate up
          dbmate status

  # ---------------------------------------------------------------------------
  # Terraform validation (syntax only, no backend, no apply)
  # ---------------------------------------------------------------------------
  terraform:
    name: terraform-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: fmt check
        run: terraform fmt -check -recursive infrastructure/terraform/

      - name: init + validate dev
        working-directory: infrastructure/terraform/environments/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate

  # ---------------------------------------------------------------------------
  # Secret scanning + i18n key sync
  # ---------------------------------------------------------------------------
  quality:
    name: quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Contrato del estimando (US-173). Solo stdlib, asi que no necesita poetry: si
      # necesitara instalacion, la tentacion seria dejarlo fuera del gate barato y ahi es
      # donde los controles se quedan "solo en local".
      - name: contrato del estimando (preregistro-check)
        run: python3 scripts/preregistro_check.py

      # Campos operativos del protocolo de US-172: impide congelarlo antes de tiempo.
      - name: protocolo de elicitacion (protocolo-check)
        run: python3 scripts/protocolo_check.py

      # Inventario de OOF. Verifica los bytes cuando el parquet esta y el puntero .dvc cuando
      # no: en un checkout limpio solo estan los punteros, y un gate que exigiera los blobs
      # seria rojo aqui para siempre.
      - name: inventario OOF
        run: python3 scripts/oof_manifest_check.py

      # Notebooks: NO stripping enforced - se commitean con outputs poblados
      # (entregable visual del curso). La reproducibilidad se valida via
      # `make notebooks-check` con papermill (job aparte, no quality gate
      # bloqueante en cada PR porque requiere data PASTIS-R + auth GEE).

      - name: i18n key parity (it/es/en)
        run: |
          python - <<'PY'
          import json, sys, pathlib
          locales_dir = pathlib.Path("frontend/i18n/locales")
          if not locales_dir.exists():
              locales_dir = pathlib.Path("frontend/locales")
          if not locales_dir.exists():
              print("no locales dir yet, skipping")
              sys.exit(0)
          locales = {}
          for code in ("it", "es", "en"):
              fp = locales_dir / f"{code}.json"
              if not fp.exists():
                  print(f"missing {fp}")
                  sys.exit(0)
              locales[code] = json.loads(fp.read_text(encoding="utf-8"))

          def flat(d, prefix=""):
              for k, v in d.items():
                  key = f"{prefix}{k}"
                  if isinstance(v, dict):
                      yield from flat(v, key + ".")
                  else:
                      yield key
          sets = {c: set(flat(v)) for c, v in locales.items()}
          ref = sets["en"]
          fail = False
          for c, s in sets.items():
              missing = ref - s
              extra = s - ref
              if missing or extra:
                  print(f"{c}: missing={sorted(missing)} extra={sorted(extra)}")
                  fail = True
          sys.exit(1 if fail else 0)
          PY
