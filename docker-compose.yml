services:
  postgres:
    build:
      context: .
      dockerfile: infrastructure/docker/postgres.Dockerfile
      args:
        POSTGIS_IMAGE: ${POSTGIS_IMAGE:-postgis/postgis:15-3.4}
    image: agrosat-postgres:15-3.4-pgvector
    environment:
      POSTGRES_USER: agrosat
      POSTGRES_PASSWORD: agrosat
      POSTGRES_DB: agrosat
    ports: ["${POSTGRES_HOST_PORT:-55432}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrosat"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_HOST_PORT:-63790}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
      target: dev
    ports: ["${API_HOST_PORT:-8010}:8000"]
    env_file: .env.local
    volumes: ["./backend:/app/backend", "./ml:/app/ml"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
      target: dev
    ports: ["${FRONTEND_HOST_PORT:-3010}:3000"]
    env_file: .env.local
    volumes: ["./frontend:/app"]
    command: pnpm dev

  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    ports: ["${TITILER_HOST_PORT:-8011}:8000"]
    environment:
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      VSI_CACHE: "TRUE"

  mlflow:
    build:
      context: .
      dockerfile: infrastructure/docker/mlflow.Dockerfile
    image: agrosat-mlflow:3.1.0-pg
    ports: ["${MLFLOW_HOST_PORT:-5010}:5000"]
    depends_on:
      postgres: { condition: service_healthy }
    command: >
      mlflow server
      --backend-store-uri postgresql://agrosat:agrosat@postgres:5432/mlflow
      --default-artifact-root /mlflow-artifacts
      --host 0.0.0.0 --port 5000
    volumes: ["./mlflow-artifacts:/mlflow-artifacts"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  dagster:
    build:
      context: .
      dockerfile: infrastructure/docker/dagster.Dockerfile
    ports: ["${DAGSTER_HOST_PORT:-3011}:3000"]
    env_file: .env.local
    # DAGSTER_HOME debe ser una ruta absoluta dentro del contenedor; el
    # valor de `.env.local` (`./dagster_home`) es relativo al host y Dagster
    # lo rechaza. `DAGSTER_PG_URL` usa el driver psycopg2 sincrono y el
    # hostname `postgres` de la red Docker (dagster-postgres no soporta el
    # driver asyncpg del `DATABASE_URL` de la app — usarlo produce
    # `sqlalchemy.exc.MissingGreenlet` al abrir el storage).
    environment:
      DAGSTER_HOME: /app/dagster_home
      DAGSTER_PG_URL: postgresql+psycopg2://agrosat:agrosat@postgres:5432/agrosat
      # `dagster_project` importa de `ml` (git_meta, features, farslip); el
      # paquete se monta en /app y debe estar en el PYTHONPATH para resolverlo.
      PYTHONPATH: /app
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - "./dagster_project:/app/dagster_project"
      # `ml/` se monta read-only: los assets de `dagster_project` importan
      # `ml.utils.git_meta`, `ml.features.*`, `ml.extractors.*` a nivel modulo.
      - "./ml:/app/ml:ro"
      # `dagster.yaml` se monta desde el repo (read-only) para que el volumen
      # nombrado `dagster_home` no secuestre una version stale del archivo —
      # el config siempre refleja el del repo, no lo cacheado en el volumen.
      - "./dagster.yaml:/app/dagster_home/dagster.yaml:ro"
      - dagster_home:/app/dagster_home
    command: dagster dev -m dagster_project.definitions -h 0.0.0.0

  ollama:
    image: ollama/ollama:latest
    ports: ["${OLLAMA_HOST_PORT:-11434}:11434"]
    volumes: ["ollama_data:/root/.ollama"]

volumes:
  postgres_data:
  ollama_data:
  dagster_home:
